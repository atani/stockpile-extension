name: CI

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Check if E2E tests exist
        id: check-e2e
        run: |
          if npm run | grep -q "test:e2e"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Chromium dependencies
        if: steps.check-e2e.outputs.exists == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcups2 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2 \
            xdg-utils \
            fonts-liberation \
            libu2f-udev \
            libvulkan1

      - name: E2E Test
        if: steps.check-e2e.outputs.exists == 'true'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npm run test:e2e

      - name: Skip E2E (not configured)
        if: steps.check-e2e.outputs.exists == 'false'
        run: echo "E2E tests not configured yet, skipping"
