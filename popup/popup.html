<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="appTitle">Stockpile</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 data-i18n="appTitle">Stockpile</h1>
      <div class="header-actions">
        <button id="settingsBtn" class="icon-btn" data-i18n-title="settings" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <div class="toggle-section">
      <label class="toggle">
        <input type="checkbox" id="enableToggle">
        <span class="toggle-slider"></span>
        <span class="toggle-label" data-i18n="autoOrganizeEnabled">Auto-organize enabled</span>
      </label>
    </div>

    <div class="search-section">
      <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" placeholder="Search downloads..." class="search-input">
      <div class="filters">
        <select id="categoryFilter" class="filter-select">
          <option value="" data-i18n="allCategories">All Categories</option>
        </select>
        <select id="siteFilter" class="filter-select">
          <option value="" data-i18n="allSites">All Sites</option>
        </select>
      </div>
    </div>

    <div class="stats">
      <span id="totalCount">0</span> <span data-i18n="downloads">downloads</span>
    </div>

    <div id="downloadList" class="download-list">
      <div class="empty-state" data-i18n="noDownloads">No downloads yet</div>
    </div>

    <div class="footer">
      <button id="exportBtn" class="btn btn-secondary" data-i18n="export">Export</button>
    </div>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
